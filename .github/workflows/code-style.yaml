name: Coding style validation

on:
    push:
        branches:
            - '**'

jobs:
    code-style-check:
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: '3.12'
                  enable-cache: true

            # The pre-commit config has local hooks (basedpyright, pydoclint)
            # that shell out to `uv run`, so the project env must be synced
            # first.
            - name: Install dependencies
              run: uv sync --group dev

            - name: Run pre-commit
              run: uv run pre-commit run --all-files
