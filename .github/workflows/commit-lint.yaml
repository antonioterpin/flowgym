name: Commit style validation

on:
    pull_request:

jobs:
    commit-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0   # full history -> lint the PR commit range

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: '3.12'

            # flowgym lints commit messages with gitlint (Conventional Commits
            # via the .gitlint contrib rule), matching the local commit-msg
            # pre-commit hook.
            - name: Run gitlint
              run: |
                  uvx gitlint --commits \
                      "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
