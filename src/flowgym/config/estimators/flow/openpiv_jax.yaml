estimator: openpiv_jax
estimate_type: flow
config:
    jit: true
    window_size: 16
    search_size: 21
    overlap: 8
    subpixel_method: gaussian # "gaussian", "parabolic" or "centroid"
    correlation_method: circular # "circular" or "linear"
    n_passes: 1 # window-deformation passes (1 = single pass)
    # sig2noise_threshold: 1.3 # flag low peak-to-peak S/N vectors as outliers
    openpiv_outlier_replacement_kernel_size: 3 # kernel size for outlier replacement
    openpiv_outlier_replacement_n_iter: 10 # number of iterations for outlier replacement
