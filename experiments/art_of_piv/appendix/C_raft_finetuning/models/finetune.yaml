# Fine-tuning recipe of the paper's RAFT32-PIV specialists (W&B
# artofpiv/RAFT32_finetuning, 2026-05-17/18), started from the pretrained
# network. Files models/<class>.yaml extend this one and set the class's data.
extends: experiments/art_of_piv/models/raft32/pretrained.yaml
study:
  name: art_of_piv/appendix/C_raft_finetuning
  tags:
    checkpoint: reproduced
config:
  jit: true
  train: true
  # Adam with global-norm clipping at 0.5. Learning rate: 0 for 100 steps,
  # then a linear one-cycle over 32k steps (5e-7 up to the 1e-5 peak by step
  # 2,100, back down to 5e-7 by step 27,300) and 5e-7 until step 50k.
  optimizer_config:
    name: adam
    hyperparams:
      learning_rate:
        schedule:
          name: join_schedules
          boundaries: [100]
          schedules:
            - name: constant
              value: 0.0
            - name: linear_onecycle
              pct_start: 0.0625
              div_factor: 20
              peak_value: 1.0e-05
              final_div_factor: 1
              transition_steps: 32000
    chain:
      - name: clip_by_global_norm
        kwargs:
          max_norm: 0.5
