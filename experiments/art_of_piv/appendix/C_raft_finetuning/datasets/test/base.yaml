# A class's test split in a fixed order, in batches of 3. Files
# datasets/test/<class>.yaml extend this one and set the class's folders and
# number of batches.
seed: 0
batch_size: 3
flow_fields_per_batch: 3
loop: true
randomize: false
buffer_size: 64
episode_length: 0
image_shape: [256, 256]
min_speed_x: 0
max_speed_x: 0
min_speed_y: 0
max_speed_y: 0
output_units: "pixels"
scheduler_class: ".mat"
include_images: true
