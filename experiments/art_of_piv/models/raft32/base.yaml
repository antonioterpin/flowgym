# RAFT32-PIV architecture shared by the pretrained network and its per-class
# specialists; each model file extends this one and sets its weights.
estimator: raft_jax
estimate_type: flow
config:
  patch_size: 32
  patch_stride: 8
  hidden_dim: 128
  context_dim: 128
  corr_levels: 4
  corr_radius: 4
  iters: 12
  patches_groups: 50
  norm_fn: instance
  dropout: 0.0
  train: false
  gamma: 0.8
  use_temporal_propagation: false
  load_mode: params_only
