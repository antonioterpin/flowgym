# Settings shared by every DIS model; each model file extends this one and
# sets its patch size, patch stride, gradient-descent iterations and levels.
estimator: dis_jax
estimate_type: flow
config:
  jit: true
  level_steps: 1
  output_full_res: true
  postprocess: src/flowgym/config/estimators/post-processing/common.yaml
  preprocess: src/flowgym/config/estimators/pre-processing/common.yaml
  preset: 1
  sequential_batch: true
  start_level: 0
  use_mean_normalization: false
  use_spatial_propagation: false
  use_temporal_propagation: false
  var_refine_iters: 0
