# Validation split of data/real_labels, in order, each pair once per
# validation (loop: false, with num_batches: all in train.yaml).
seed: 0
batch_size: 20
flow_fields_per_batch: 20
include_images: true
loop: false
randomize: false
buffer_size: 64
episode_length: 0
image_shape: [256, 256]
min_speed_x: 0
max_speed_x: 0
min_speed_y: 0
max_speed_y: 0
output_units: "pixels"
scheduler_class: ".mat"
file_list:
  - data/real_labels/val
